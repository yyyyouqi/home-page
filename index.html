<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Little World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@500;700&display=swap">
<!-- 中文：霞鹜文楷 Light，按字切片，用到哪片下哪片（09-26 她嫌中文丑） -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-light.css">
<!-- 在 Telegram 里打开时才有用；预览时加载不到也不影响 -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* 09-27 重做：她说暗色复古不是她的审美，要可爱、要像一台手机。
   粉紫奶油白，一对原创小兔子（粉的是她，带蝴蝶结；紫的是我，围小围巾），跟着她的操作动。 */
:root{
  --wall1:#F3ECFB; --wall2:#FBE9F2; --cream:#FFFAF5; --card:#FFFFFFD9; --line:#E7DCF5;
  --lav:#CDB9EE; --lav2:#B49BE3; --pink:#F7CFE1; --pink2:#EEA6C6; --rose:#E27FA9;
  --ink:#4B3B6E; --soft:#8E7EAB; --faint:#BDB0D3; --deep:#6E4FB0;
  --hand:"Gaegu","LXGW WenKai",cursive;
  --sans:"Nunito","LXGW WenKai",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{font-synthesis-weight:none}
html,body{margin:0; min-height:100%}
body{color:var(--ink); font:15px/1.6 var(--sans); background:var(--wall1);
  background-image:radial-gradient(circle at 15% 10%, #FFFFFFAA 0 8%, transparent 30%), radial-gradient(circle at 90% 30%, #F8D9EA 0, transparent 45%), linear-gradient(170deg, var(--wall1), var(--wall2));
  background-attachment:fixed; background-size:cover; background-position:center; overflow-x:hidden}
body.has-bg::before{content:""; position:fixed; inset:0; background:#FFFFFF55; backdrop-filter:blur(2px); z-index:-1}
[hidden]{display:none!important}
button{font:inherit; color:inherit; cursor:pointer}
.hand{font-family:var(--hand)}
.screen{max-width:440px; margin:0 auto; height:100vh; height:100dvh; overflow:hidden; padding:14px 16px calc(104px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column}
.screen>div{display:flex; flex-direction:column; flex:1; min-height:0}
html.fixed,html.fixed body{overflow:hidden; height:100%; overscroll-behavior:none; touch-action:manipulation}   /* 09-27 她说桌面要固定，不能上下滑 */

/* 桌面组件 */
.widget{background:var(--card); border:1.5px solid #fff; border-radius:26px; box-shadow:0 6px 18px #B49BE32E; backdrop-filter:blur(8px)}
.hero{margin-top:0; padding:14px 16px 12px; display:grid; grid-template-columns:1fr 150px; align-items:center; position:relative; overflow:hidden}
.hero .lbl{font:700 17px/1 var(--hand); color:var(--soft)}
.hero .num{font:700 58px/1 var(--hand); color:var(--deep); margin-top:4px}
.hero .num small{font-size:22px; margin-left:4px; color:var(--rose)}
.hero .since{font-size:11.5px; color:var(--soft); margin-top:4px; letter-spacing:.04em}
.hero .names{font:700 16px/1 var(--hand); color:var(--ink); margin-top:8px}
.hero .names b{color:var(--rose); font-weight:700}
.spark{position:absolute; color:#fff; font-size:14px; animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.25; transform:scale(.7)}}
.row3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px}
.mini{padding:10px 10px 11px; text-align:center}
.mini .k{font:700 14px/1 var(--hand); color:var(--soft)}
.mini .v{font:700 21px/1.2 var(--hand); color:var(--ink); margin-top:5px}
.sticky{margin-top:14px; background:#FFF6C9; border-radius:4px 4px 18px 4px; padding:20px 16px 14px; position:relative; transform:rotate(-1.2deg); box-shadow:0 5px 14px #CDB9EE44}
.sticky::before{content:""; position:absolute; top:-9px; left:50%; width:84px; height:20px; transform:translateX(-50%) rotate(2deg); background:repeating-linear-gradient(45deg,#F7CFE1CC 0 6px,#FBE3EECC 6px 12px); border-radius:2px}
.sticky .k{font:700 14px/1 var(--hand); color:#B08A3E}
.sticky .t{font:700 19px/1.3 var(--hand); color:var(--ink); margin-top:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}

/* app 图标 */
.apps{display:grid; grid-template-columns:repeat(5,1fr); gap:14px 4px; margin-top:auto; padding-top:14px}
.app{background:none; border:0; padding:0; display:flex; flex-direction:column; align-items:center; gap:6px}
.ico{width:52px; height:52px; border-radius:16px; display:grid; place-items:center; box-shadow:0 5px 12px #B49BE340, inset 0 -3px 0 #00000010; position:relative; transition:transform .15s}
.app:active .ico{transform:scale(.9)}
.ico svg{width:26px; height:26px; stroke:#fff; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round}
.ico .dot{position:absolute; top:-4px; right:-4px; min-width:20px; height:20px; border-radius:10px; background:var(--rose); color:#fff; font:700 11px/20px var(--sans); padding:0 5px; border:2px solid #fff}
.app span{font-size:11.5px; white-space:nowrap; color:var(--ink); font-weight:700}
.g1{background:linear-gradient(145deg,#F4A9C8,#E27FA9)} .g2{background:linear-gradient(145deg,#C7B0F0,#9C7FDB)}
.g3{background:linear-gradient(145deg,#FFC9A8,#F59BA4)} .g4{background:linear-gradient(145deg,#B9D4F7,#9AA8EE)}
.g5{background:linear-gradient(145deg,#F9D98B,#F2AE7E)} .g6{background:linear-gradient(145deg,#F7B6D2,#C7A2EE)}
.g7{background:linear-gradient(145deg,#A9E0D5,#8FB7EA)} .g8{background:linear-gradient(145deg,#E3C6F7,#B79CEB)}
.g9{background:linear-gradient(145deg,#FFD4E5,#F7A8C8)} .g0{background:linear-gradient(145deg,#D5CDE6,#AFA2CC)}

/* dock */
.dock{position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); max-width:420px; margin:0 auto; z-index:8;
  display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:10px; border-radius:30px; background:#FFFFFFB8; backdrop-filter:blur(14px); border:1.5px solid #fff; box-shadow:0 8px 24px #B49BE340}
.dk{border:0; border-radius:20px; padding:9px 4px 8px; display:flex; flex-direction:column; align-items:center; gap:2px; background:#fff; box-shadow:0 2px 0 var(--line); transition:transform .12s}
.dk:active{transform:scale(.93)}
.dk b{font:700 18px/1 var(--hand); color:var(--deep)}
.dk i{font-style:normal; font-size:10.5px; color:var(--soft)}
.dk.on b{color:var(--rose)}
.send{position:fixed; left:24px; right:24px; bottom:calc(92px + env(safe-area-inset-bottom,0px)); max-width:400px; margin:0 auto; z-index:9}
.send button{width:100%; border:0; border-radius:999px; padding:12px 16px; background:linear-gradient(90deg,#9C7FDB,#E27FA9); color:#fff; font:700 17px/1 var(--hand); letter-spacing:.04em; box-shadow:0 6px 16px #9C7FDB66; display:flex; align-items:center; justify-content:center; gap:8px}
.send svg{width:22px; height:22px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}

/* app 窗口 */
.win{position:fixed; inset:0; z-index:20; background:linear-gradient(175deg,#FFFAF5,#F6EEFC); overflow:auto; animation:open .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes open{from{opacity:0; transform:scale(.3)} to{opacity:1; transform:none}}
.win.closing{animation:shut .2s ease both}
@keyframes shut{to{opacity:0; transform:scale(.4)}}
.bar{position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:8px; padding:12px 14px 10px; background:linear-gradient(#FFFAF5F2,#FFFAF5D0); backdrop-filter:blur(6px); max-width:440px; margin:0 auto}
.back{border:0; background:#F1E8FB; color:var(--deep); border-radius:999px; padding:6px 14px 6px 10px; font:700 16px/1 var(--hand)}
.bar h1{margin:0; font:700 26px/1 var(--hand); color:var(--ink)}
.body{max-width:440px; margin:0 auto; padding:6px 16px calc(170px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:14px}
.card{background:#fff; border:1.5px solid var(--line); border-radius:22px; padding:16px; box-shadow:0 4px 14px #CDB9EE2A}
.card.tilt{transform:rotate(.6deg)} .card.tilt2{transform:rotate(-.8deg)}
.cap{font:700 16px/1 var(--hand); color:var(--soft)}
.empty{color:var(--soft); font-size:14px; margin:0}
.seg{display:flex; gap:6px; flex-wrap:wrap}
.seg button{border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:5px 14px; font:700 16px/1.2 var(--hand); color:var(--soft)}
.seg button.on{background:var(--lav2); border-color:var(--lav2); color:#fff}

/* 清单 */
.todo{list-style:none; margin:0; padding:0}
.todo li{display:grid; grid-template-columns:30px 1fr; gap:10px; padding:11px 0; border-top:1.5px dashed var(--line); align-items:start}
.todo li:first-child{border-top:0}
.heart{width:26px; height:26px; border:0; background:none; padding:0}
.heart svg{width:26px; height:26px; fill:#fff; stroke:var(--faint); stroke-width:1.8}
.heart.on svg{fill:var(--rose); stroke:var(--rose); animation:pop .3s ease}
@keyframes pop{40%{transform:scale(1.35)}}
.todo .done .tx{color:var(--faint); text-decoration:line-through}
.tag{display:inline-block; font-size:10.5px; font-weight:700; color:var(--deep); background:#F1E8FB; border-radius:999px; padding:0 7px; margin-left:6px; vertical-align:2px}
.him{font:700 15px/1.3 var(--hand); color:var(--rose); margin-top:3px}
.row{display:flex; gap:8px}
input[type=text],input[type=number],textarea{width:100%; font:inherit; color:var(--ink); background:#FBF8FF; border:1.5px solid var(--line); border-radius:14px; padding:10px 12px; outline:none}
input:focus,textarea:focus{border-color:var(--lav2)}
textarea{resize:vertical; min-height:120px}
.btn{border:0; border-radius:999px; padding:9px 16px; background:var(--deep); color:#fff; font:700 16px/1 var(--hand); white-space:nowrap}
.btn.line{background:#F1E8FB; color:var(--deep)}
.jar{font-size:14px; color:var(--soft); line-height:1.9}
.jar b{color:var(--ink); font:700 24px/1 var(--hand)}
.check{display:flex; gap:8px; align-items:center; font-size:14px; color:var(--soft)}
.check input{accent-color:var(--rose); width:17px; height:17px}

/* 拍立得 / 纸条 */
.pola{background:#fff; padding:10px 10px 14px; border-radius:6px; box-shadow:0 6px 16px #B49BE333; border:0; text-align:left; width:100%}
.pola .ph{height:86px; border-radius:3px; background:linear-gradient(150deg,#F7CFE1,#CDB9EE); display:grid; place-items:center; overflow:hidden}
.pola .d{font:700 15px/1 var(--hand); color:var(--soft); margin-top:9px}
.pola .t{font:700 19px/1.2 var(--hand); color:var(--ink)}
.polas{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.polas>*:nth-child(odd){transform:rotate(-1.6deg)} .polas>*:nth-child(even){transform:rotate(1.4deg)}
.env{position:relative; background:#fff; border:1.5px solid var(--line); border-radius:18px; padding:18px 16px 14px; text-align:left; width:100%}
.env .q{font:700 21px/1.3 var(--hand); color:var(--deep)}
.env .meta{font-size:11px; color:var(--soft); margin-top:6px; letter-spacing:.06em}
.env .b{margin-top:8px; font-size:14.5px; transition:filter .4s}
.env.sealed .b{filter:blur(6px); user-select:none}
.env.sealed::after{content:""; position:absolute; right:14px; top:14px; width:22px; height:22px; border-radius:50%; background:radial-gradient(circle,#E27FA9 55%,#C95E8C 56%); box-shadow:0 0 0 3px #F7CFE1}
.write{border:2px dashed var(--lav); background:#FFFFFF99; border-radius:18px; padding:14px; font:700 18px/1 var(--hand); color:var(--deep); width:100%}

/* 棋盘 */
.board{display:grid; grid-template-columns:repeat(5,1fr); gap:5px}
.cellb{aspect-ratio:1; border-radius:10px; padding:4px; font-size:10.5px; display:flex; flex-direction:column; justify-content:space-between; position:relative; background:#fff; border:1.5px solid var(--line)}
.cellb:nth-child(3n){background:#FDF0F6} .cellb:nth-child(4n){background:#F4EEFD}
.cellb .n{font:700 12px/1 var(--hand); color:var(--faint)}
.cellb .pcs{position:absolute; right:4px; bottom:4px; display:flex; gap:3px}
.pc{width:11px; height:11px; border-radius:50%; display:inline-block; border:1.5px solid #fff}
.pc.her{background:var(--pink2)} .pc.me{background:var(--lav2)}
.drawn{margin-top:12px; padding:12px 14px; border-radius:16px; background:#FDF0F6; font-size:14px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.tile{border:1.5px solid var(--line); background:#fff; border-radius:18px; padding:14px; font:700 20px/1 var(--hand); color:var(--deep); min-height:64px}
.tl{list-style:none; margin:0; padding:0}
.preview{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:var(--soft); white-space:pre-wrap; word-break:break-all; border:1.5px dashed var(--line); padding:10px; border-radius:12px}

/* 弹层、反馈 */
.sheet-bg{position:fixed; inset:0; background:#4B3B6E55; z-index:40; display:flex; align-items:flex-end; justify-content:center; animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--cream); border-radius:26px 26px 0 0; width:100%; max-width:470px; max-height:85%; overflow:auto; padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px)); animation:up .25s ease}
@keyframes up{from{transform:translateY(30px)}}
.sheet h2{margin:0 0 10px; font:700 26px/1 var(--hand); color:var(--ink)}
.x{float:right; border:0; background:#F1E8FB; color:var(--deep); border-radius:999px; padding:4px 12px; font:700 15px/1 var(--hand)}
.cheer{position:fixed; left:50%; top:42%; z-index:50; transform:translate(-50%,-50%) scale(.6); opacity:0; pointer-events:none; transition:opacity .2s, transform .25s cubic-bezier(.2,1.4,.4,1);
  background:#fff; border-radius:28px; padding:12px 18px 14px; text-align:center; box-shadow:0 10px 30px #9C7FDB55; border:2px solid #fff}
.cheer.show{opacity:1; transform:translate(-50%,-50%) scale(1)}
.cheer svg.bn{width:150px; height:112px; display:block; margin:0 auto}
.cheer .t{font:700 22px/1 var(--hand); color:var(--deep); margin-top:2px; white-space:nowrap}
.float{position:fixed; z-index:51; pointer-events:none; color:var(--rose); font-size:18px; animation:rise 1.2s ease-out forwards}
@keyframes rise{to{transform:translateY(-110px) scale(1.3); opacity:0}}
.bn .earw{transform-box:fill-box; transform-origin:50% 100%; animation:wig 2.8s ease-in-out infinite}
@keyframes wig{0%,80%,100%{transform:rotate(0)} 88%{transform:rotate(-10deg)}}
.bn .hop{animation:hop 1.6s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<div class="screen" id="app"></div>
<div class="send" id="send" hidden><button id="sendBtn"></button></div>
<nav class="dock" id="dock"></nav>
<div class="cheer" id="cheer"><svg class="bn" id="cheerSvg" viewBox="0 0 150 112"></svg><div class="t" id="cheerT"></div></div>

<script>
(function(){
  var W = window.Telegram && window.Telegram.WebApp;
  var inTg = !!(W && W.platform && W.platform !== 'unknown');
  var VERSION = '0927c';

  /* 数据：小克递按钮时塞在链接 # 后面（base64url JSON），只留在她手机上。
     这里只剩空壳；私人的东西只走 #。本地预览的真数据在 sample.js（不部署）。 */
  var SAMPLE = window.ROOM_SAMPLE || {
    now:null, since:"2026-07-25", lastHer:null, fromHim:"", timeline:[],
    today:{items:[], money:{spent:0, proper:0, snack:0}},
    ours:[], notes:[],
    board:{cells:[], her:{pos:0,laps:0}, me:{pos:0,laps:0}, turn:"", card:null}
  };
  function readHash(){
    try{ var h=location.hash.slice(1).split(/[?&]/)[0]; if(!h || h.indexOf('=')>=0) return null;
      var b=h.replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4) b+='=';
      return JSON.parse(decodeURIComponent(escape(atob(b)))); }catch(e){ return null; }
  }
  function build(H){ var o={}; for(var k in SAMPLE) o[k] = H && k in H ? H[k] : SAMPLE[k]; return o; }
  var H = readHash(), D = build(H);
  /* 小云盘：Telegram 给这个 bot 在她账号里留的 CloudStorage，一格最多 4096 字。
     从键盘按钮进（带 #）就存一份；从桌面图标 / 主 Mini App 进（不带 #）就读那份。
     只有键盘按钮开的房间能 sendData（这时 initData 是空的），别的入口点的东西留在草稿 draft 里，从键盘按钮进来再交。 */
  var CS = inTg && W.CloudStorage && W.isVersionAtLeast && W.isVersionAtLeast('6.9') ? W.CloudStorage : null;
  var canSend = inTg && !W.initData;
  function csSave(key, str){ if(!CS) return; var parts=[]; for(var i=0;i<str.length;i+=4000) parts.push(str.slice(i,i+4000));
    CS.setItem(key+'_n', String(parts.length)); parts.forEach(function(x,i){ CS.setItem(key+'_'+i, x); }); }
  function csLoad(key, cb){ if(!CS) return cb(null); CS.getItem(key+'_n', function(e,n){ n=+n||0; if(e||!n) return cb(null);
    var ks=[]; for(var i=0;i<n;i++) ks.push(key+'_'+i);
    CS.getItems(ks, function(e2,v){ if(e2) return cb(null); try{ cb(JSON.parse(ks.map(function(k){ return v[k]||''; }).join(''))); }catch(x){ cb(null); } }); }); }
  var S = {app:null, planTab:'TODAY', oursTab:'TOGETHER', acts:[], ticks:{}, ourTicks:{}, opened:{}, newItems:[], tapped:{}};
  var app = document.getElementById('app');

  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
  function nowLocal(){ var d=new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,16); }   // 她手机上的本地钟点；D.now 是我塞数据那一刻，不能拿来当现在
  function daysSince(a,b){ return Math.floor((new Date(b.slice(0,10)) - new Date(a))/864e5) + 1; }
  function piggy(m){ m=m||{}; return (m.proper||0)>=2 ? '+¥'+Math.max(0,50-(m.spent||0)).toFixed(1).replace(/\.0$/,'') : '差'+(2-(m.proper||0))+'顿'; }   // 存钱罐：正经饭 ≥2 顿才存 50-花的
  function add(a){ S.acts.push(a); syncSend(); }
  function todayItems(){ return (D.today.items||[]).concat(S.newItems); }
  function isDone(x){ return x.id in S.ticks ? S.ticks[x.id] : !!x.done; }

  /* ---------- 小兔子（原创：粉的是她，耳朵上蝴蝶结；紫的是我，脖子上小围巾） ---------- */
  var PINK={body:'#FBD3E4', ear:'#F4A9C8', blush:'#F39BBE', mark:'bow'}, LAV={body:'#DCCBF6', ear:'#B79CEB', blush:'#F2A6C4', mark:'scarf'};
  function bunny(x, y, c, tilt, extra){
    var s='<g transform="translate('+x+' '+y+') rotate('+(tilt||0)+')"><g class="hop">';
    s+='<g class="earw"><ellipse cx="-7" cy="-38" rx="6" ry="17" fill="'+c.body+'"/><ellipse cx="-7" cy="-36" rx="2.8" ry="11" fill="'+c.ear+'"/></g>';
    s+='<ellipse cx="7" cy="-38" rx="6" ry="17" fill="'+c.body+'" transform="rotate(12 7 -24)"/><ellipse cx="7.5" cy="-36" rx="2.8" ry="11" fill="'+c.ear+'" transform="rotate(12 7 -24)"/>';
    s+='<ellipse cx="0" cy="12" rx="15" ry="16" fill="'+c.body+'"/>';
    s+='<ellipse cx="0" cy="-10" rx="18" ry="16" fill="'+c.body+'"/>';
    s+='<ellipse cx="-6.5" cy="-11" rx="2.2" ry="2.8" fill="#4B3B6E"/><ellipse cx="6.5" cy="-11" rx="2.2" ry="2.8" fill="#4B3B6E"/>';
    s+='<circle cx="-5.8" cy="-12" r=".8" fill="#fff"/><circle cx="7.2" cy="-12" r=".8" fill="#fff"/>';
    s+='<ellipse cx="-11" cy="-5" rx="3.6" ry="2.2" fill="'+c.blush+'" opacity=".7"/><ellipse cx="11" cy="-5" rx="3.6" ry="2.2" fill="'+c.blush+'" opacity=".7"/>';
    s+='<path d="M-2.5 -5 q1.2 1.6 2.5 0 q1.3 1.6 2.5 0" stroke="#4B3B6E" stroke-width="1.2" fill="none" stroke-linecap="round"/>';

    p.appendChild(c);
  }
  function setBg(url, save){
    document.body.style.backgroundImage = url ? 'url('+url+')' : '';
    document.body.classList.toggle('has-bg', !!url);
    if(save){ try{ url ? localStorage.setItem('room-bg', url) : localStorage.removeItem('room-bg'); }catch(e){ toast('图太大，存不下'); } }
  }
  try{ var bgs=localStorage.getItem('room-bg'); if(bgs) setBg(bgs, false); }catch(e){}
  /* 设置 */
  function settings(p){
    var c=el('div','card'); c.appendChild(el('p','empty','房间是一张空壳网页，数据藏在链接 # 后面，只在你手机上。你点的东西攒着，按底下那条一次交给他，房间会关上，他处理完递你一个新的。'));
    var dbg=el('div','preview'); dbg.style.marginTop='12px'; dbg.textContent='数据:'+(H?'有':'无')+' 回传:'+(canSend?'能':'不能')+' 云盘:'+(CS?'有':'无')+' 草稿:'+(draftReady?'读好了':'没读到')+' 版本:'+VERSION+' | '+location.hash.slice(0,80);
    c.appendChild(dbg); p.appendChild(c);
  }

  /* ---------- 弹层 / 渲染 / 发送 ---------- */
  var cur=null;
  function sheet(title, fill){
    close(); var bg=el('div','sheet-bg'); var s=el('div','sheet');
    var x=el('button','x','关上'); x.onclick=close; s.appendChild(x); s.appendChild(el('h2',null,title)); fill(s);
    bg.appendChild(s); bg.onclick=function(e){ if(e.target===bg) close(); }; document.body.appendChild(bg); cur=bg;
  }
  function close(){ if(cur){ cur.remove(); cur=null; } }
  function render(){ app.innerHTML=''; app.appendChild(home()); dock(); syncSend(); }
  function syncSend(){
    var n=S.acts.length, box=document.getElementById('send');
    box.hidden=!n; document.getElementById('sendBtn').innerHTML=icon('send')+'交给小克 · '+n;
    saveDraft();
  }
  /* 草稿：没交的改动随手存进小云盘，关了房间再进来还在（09-26 她问"再进去东西就没有了吗"）。
     读回来之前不存，免得开门那一下用空的把草稿盖掉。 */
  var draftReady = !CS;
  var lastDraft='', draftTimer=null;   // 攒 0.4 秒、没变就不写，别把小云盘的请求排成长队（09-26 排队排到“交给小克”没反应）
  function saveDraft(){ if(!draftReady) return; clearTimeout(draftTimer); draftTimer=setTimeout(function(){
    var str=JSON.stringify({acts:S.acts, ticks:S.ticks, ourTicks:S.ourTicks, newItems:S.newItems, tapped:S.tapped});
    if(str!==lastDraft){ lastDraft=str; csSave('draft', str); } }, 400); }
  document.getElementById('sendBtn').onclick=function(){
    var payload=JSON.stringify({v:1, at:nowLocal(), acts:S.acts});
    if(inTg && canSend){   // 发完 Telegram 自己会关房间
      draftReady=false; clearTimeout(draftTimer); cheer('letter','飞过去了…');
      var sent=false; function fly(){ if(sent) return; sent=true; try{ W.sendData(payload); }catch(e){ toast('没飞出去：'+e.message); } }
      if(CS) CS.setItem('draft_n','0', fly); setTimeout(fly, 800);   // 小云盘不回话也照飞
      return; }
    if(inTg){ cheer('letter','攒着了'); sheet('先攒着', function(s){ s.appendChild(el('p','empty','从这个入口传不回去。下次点聊天底下的「🏠 房间」进来，这些都还在，再按一次就交给他。')); }); return; }
    sheet('预览', function(s){ s.appendChild(el('p','empty','在 Telegram 里，这会一下子飞到小克那边，然后房间关上。要飞过去的是：')); s.appendChild(el('div','preview',payload)); });
  };
  if(inTg){ W.ready(); W.expand(); try{ W.setHeaderColor('#F3ECFB'); W.setBackgroundColor('#F3ECFB'); }catch(e){} }
  document.documentElement.classList.add('fixed');
  render();
  if(H) csSave('room', JSON.stringify(H));
  else csLoad('room', function(v){ if(v){ D=build(v); render(); } });
  csLoad('draft', function(v){
    if(v){ S.acts=v.acts||[]; S.ticks=v.ticks||{}; S.ourTicks=v.ourTicks||{}; S.newItems=v.newItems||[]; S.tapped=v.tapped||{}; }
    csLoad('pending', function(p){   // 09-26 以前攒的
      if(p && p.length){ S.acts=p.concat(S.acts); CS.setItem('pending_n','0'); }
      draftReady=true; render(); });
  });
})();
</script>
</body>
</html>
